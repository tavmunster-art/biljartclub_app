<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinator login</title>
</head>
<body>
<main style="max-width:360px; margin:80px auto; padding:24px; font-family:sans-serif;">
<h1>Coordinator</h1>
{% if error %}<p style="color:#b00020;">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
<label for="password">Wachtwoord</label><br>
<input id="password" name="password" type="password" required autofocus><br><br>
<button type="submit">Inloggen</button>
</form>
</main>
</body>
</html>
